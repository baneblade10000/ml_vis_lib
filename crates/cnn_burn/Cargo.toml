[package]
name = "cnn_burn"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Hand-rolled educational CNN (Rust CPU + WebGPU) for ml_vis_lib"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "cnn_burn_smoke"
path = "src/bin/smoke.rs"

[features]
default = ["native"]
native = []
wasm = [
  "dep:wasm-bindgen",
  "dep:console_error_panic_hook",
  "dep:js-sys",
  "dep:serde-wasm-bindgen",
  "dep:wasm-bindgen-futures",
]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = { version = "0.8", features = ["std", "std_rng"] }
rayon = "1.10"
# Entropy for wasm32.
getrandom = { version = "0.2", features = ["js"] }

wasm-bindgen = { version = "0.2", optional = true }
console_error_panic_hook = { version = "0.1", optional = true }
js-sys = { version = "0.3", optional = true }
serde-wasm-bindgen = { version = "0.6", optional = true }
wasm-bindgen-futures = { version = "0.4", optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wgpu = { version = "24.0.3", default-features = false, features = ["wgsl", "webgpu"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
wgpu = { version = "24.0.3", default-features = true, features = ["wgsl"] }
pollster = "0.4"
