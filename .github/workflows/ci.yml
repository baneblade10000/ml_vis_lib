# Continuous integration: typecheck, test, and build on every push/PR.
# (The separate pages.yml only deploys; it never ran checks, so regressions
# like type errors and broken tests went unnoticed.)
name: ci

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # Order matters only for clarity; turbo caches and dedupes the upstream
      # builds shared by lint/test/build.
      - name: Typecheck (lint)
        run: pnpm lint

      - name: ESLint
        run: pnpm lint:eslint

      - name: Unit tests
        run: pnpm test

      - name: Build
        run: pnpm build
